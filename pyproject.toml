[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genealogy-mcp"
version = "0.3.2"
description = "Genealogy research toolkit for AI assistants (MCP server): 114 archives and databases (Russia and the former USSR, Europe, Latin America, US), where a province's records are kept today, live search, name variants and Daitch–Mokotoff, Julian/Hebrew/Republican calendars, church feasts, kinship and DNA, evidence checks, a research project that remembers, GEDCOM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Igor Melnikov" }]
keywords = ["genealogy", "family history", "mcp", "model context protocol", "claude", "llm", "gedcom", "ancestry",
            "familysearch", "archives", "russia", "ukraine", "europe", "latin america", "генеалогия", "родословная"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Sociology :: Genealogy",
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Natural Language :: Russian",
]
dependencies = ["mcp>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/igormel81/genealogy-mcp"
Issues = "https://github.com/igormel81/genealogy-mcp/issues"
"Family archive engine" = "https://github.com/igormel81/gene_archive"

[project.scripts]
genealogy-mcp = "genealogy_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genealogy_mcp = ["data/*.json", "data/docs/*.md"]
