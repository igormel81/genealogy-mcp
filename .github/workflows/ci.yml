name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pyflakes
      - name: gene-archive, for the site-folder bridge tests
        run: pip install git+https://github.com/igormel81/gene_archive
      - run: pyflakes src tests tools
      - name: the catalogue is generated from tools/make_sources.py
        run: |
          python tools/make_sources.py
          git diff --exit-code src/genealogy_mcp/data/sources.json
      - run: python -m unittest discover -v tests
      - name: the tools answer every benchmark question correctly
        run: python evals/check_tools.py
      - name: the Claude Desktop extension builds and validates
        if: matrix.python == '3.12'
        run: |
          python tools/make_mcpb.py
          git diff --exit-code mcpb/manifest.json
          npx -y @anthropic-ai/mcpb validate mcpb/manifest.json
      - name: one version in pyproject.toml, server.json and the package
        if: matrix.python == '3.12'
        run: |
          python - <<'PY'
          import json, re, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          s = json.load(open("server.json"))
          init = re.search(r'__version__ = "(.+?)"', open("src/genealogy_mcp/__init__.py").read())[1]
          assert s["version"] == v and all(p["version"] == v for p in s["packages"]) and init == v, (v, s["version"], init)
          assert len(s["description"]) <= 100, "server.json description: 100 characters at most"
          PY
      - name: the server starts and answers over stdio
        run: |
          # keep stdin open a moment: on EOF the server may stop before it answers the last request
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 3) | timeout 20 genealogy-mcp | tee out.txt
          grep -q '"find_sources"' out.txt
  docker:
    # what Glama and other hosts do: build the image, start it over stdio, list the tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t genealogy-mcp .
      - name: the container answers over stdio
        run: |
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5) | timeout 60 docker run -i --rm genealogy-mcp | tee out.txt
          grep -q '"where_are_records"' out.txt
