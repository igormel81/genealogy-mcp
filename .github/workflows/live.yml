name: Live sources
# The open APIs behind search_online and place_history answer as expected.
on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python tests/live/check_online.py
