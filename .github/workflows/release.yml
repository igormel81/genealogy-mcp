name: Release
# Actions → Release → Run workflow: tags v<version from pyproject.toml>, builds, makes a GitHub release.
# PyPI: add a trusted publisher on pypi.org (workflow release.yml, environment pypi) and set the
# repository variable PYPI_PUBLISH=true.
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          notes=$(awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "v$v" dist/* --title "v$v" --notes "$notes" --target "$GITHUB_SHA"
      - if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
